/* 본문·내용: Pretendard / 강조: 부산단디명조 (L·M·B) — 둘 다 전시 문구에 쓰는 글자만 담아 내장 */
@font-face{font-family:"Pretendard JP";font-weight:400;font-style:normal;font-display:swap;src:url("assets/fonts/pretendard-jp-400.woff") format("woff")}
@font-face{font-family:"Another Typewriter";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/another-typewriter.ttf") format("truetype")}   /* 장 제목 옆 [E01. Arrive] — Johan Holmdahl, "No rights reserved" */
@font-face{font-family:"Cafe24 Anemone";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/cafe24-anemone-400.woff") format("woff")}
@font-face{font-family:"Pretendard";font-weight:100;font-style:normal;font-display:swap;src:local("Pretendard Thin"),local("Pretendard-Thin"),url("assets/fonts/pretendard-100.woff") format("woff")}
@font-face{font-family:"Pretendard";font-weight:400;font-style:normal;font-display:swap;src:local("Pretendard Regular"),local("Pretendard-Regular"),url("assets/fonts/pretendard-400.woff") format("woff")}
@font-face{font-family:"Pretendard";font-weight:500;font-style:normal;font-display:swap;src:local("Pretendard Medium"),local("Pretendard-Medium"),url("assets/fonts/pretendard-500.woff") format("woff")}
@font-face{font-family:"Pretendard";font-weight:600;font-style:normal;font-display:swap;src:local("Pretendard SemiBold"),local("Pretendard-SemiBold"),url("assets/fonts/pretendard-600.woff") format("woff")}
@font-face{font-family:"Pretendard";font-weight:700;font-style:normal;font-display:swap;src:local("Pretendard Bold"),local("Pretendard-Bold"),url("assets/fonts/pretendard-700.woff") format("woff")}
@font-face{font-family:"Pretendard";font-weight:800;font-style:normal;font-display:swap;src:local("Pretendard ExtraBold"),local("Pretendard-ExtraBold"),url("assets/fonts/pretendard-800.woff") format("woff")}
@font-face{font-family:"Busan Dandi Myeongjo";font-weight:300;font-style:normal;font-display:swap;src:url("assets/fonts/busan-dandi-300.woff") format("woff")}
@font-face{font-family:"Busan Dandi Myeongjo";font-weight:500;font-style:normal;font-display:swap;src:url("assets/fonts/busan-dandi-500.woff") format("woff")}

<style>
/* ═══════════ 화면 위 글자·버튼 (CSS) — 자주 고치는 곳 ═══════════
   · 왼쪽 위 로고 ............ #brand .b1 (ONLINE EXHIBITION) / #brand .b2 (避亂首都 釜山)
   · 오른쪽 위 버튼 .......... .top button (버튼 크기) / #bgmBtn svg (볼륨 아이콘) / #menuBtn span (햄버거 선)
   · 모바일 아래 바 .......... #mnav / #mnav button (PREV·NEXT) / #pCount (가운데 번호)
   · 모바일 위·아래 바 색 .... "모바일 위쪽 바" 주석 아래 @media 블록
   · 햄버거 메뉴 ............. .menu-panel / .mgo (챕터 제목) / .msub button (장소 이름)
   · 이야기 창 ............... .sheet-panel / .s-title h2 / .sheet-body
   · 엔딩 화면 ............... #endScreen h2 / #endScreen .end-p
   · 벽에 붙은 글자는 CSS가 아니라 스크립트의 const WALL 에서 고칩니다
   ═══════════════════════════════════════════════════════════════ */
/* Layout: 전체화면 3D 전시실 + 하단(모바일)/좌측(데스크톱) 캡션 카드 + 우측 상세 시트. 색·글꼴은 Desktop.pdf 시안 기준, 단일 테마. */
:root{
  --wall:#FDFDFD;      /* 벽면 */
  --ink:#1A1A1A;       /* 내용 */
  --accent:#3B5998;    /* 강조 */
  --gray:#6E6E6E;      /* 보조 (흰 바탕 대비 약 5:1) */
  --line:#D9D9D9;
  --card:#6E6E6E;      /* 캡션 카드 */
  --side:#B9B9B9;      /* 전시실 바깥 */
  --menu:#474747;      /* 메뉴 패널 */
  --hi:#8FB0F5;        /* 메뉴 현재 위치 (강조색의 밝은 단계) */
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Busan Dandi Myeongjo","Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --num:"Pretendard",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--side);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#gl.hover{cursor:pointer}
.sideblur{position:fixed;top:0;bottom:0;z-index:5;pointer-events:none;-webkit-backdrop-filter:blur(6.3px);backdrop-filter:blur(6.3px);opacity:0;transition:opacity .6s}
.sideblur.on{opacity:1}
#sideBlurL{left:0;width:0;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 90px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 90px),transparent)}
#sideBlurR{left:100%;right:0;-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 90px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 90px),transparent)}
#fade{position:fixed;inset:0;z-index:9;background:#FDFDFD;opacity:0;pointer-events:none}

/* 상단 고정 버튼 (시안: 왼쪽 재생 원형 / 오른쪽 햄버거) */
.top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 0 22px;pointer-events:none}
.top button{pointer-events:auto;width: 30px;height: 33px;display:grid;place-items:center}
#bgmBtn{width:34px;display:flex;align-items:center;justify-content:flex-start}#bgmBtn svg{height: 27px;width:auto;display:block;color:var(--ink);overflow:visible}#bgmBtn .ico-off,#bgmBtn[aria-pressed="false"] .ico-on{display:none}#bgmBtn[aria-pressed="false"] .ico-off{display:block}
.top-r{display:flex;align-items:center;gap: 16px;}
#brand{pointer-events:none;display:flex;flex-direction:column;gap:6px;color:var(--ink);transition:opacity .5s}
#brand.off{opacity:0}
#brand .b1{font:400 14px/1 var(--sans);letter-spacing:.06em}
#brand .b2{font:400 15px/1 "Pretendard JP",var(--sans);letter-spacing:.08em}
@media (max-width:759px){#brand .b1{font-size:12px}#brand .b2{font-size: 14px;}}
/* 배경음악 안내 팝업 */
#menuBtn{justify-items:end}
#menuBtn span{display:block;width: 28px;height: 2px;border-radius: 2px;background:var(--ink);margin: 2px 0;}

/* 메인: 왼쪽 아래 SCROLL 표시 (데스크톱) */
#hero{position:fixed;left:34px;bottom:30px;z-index:10;pointer-events:none;transition:opacity .5s}
#hero.off{opacity:0}
.scrollcue{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink);font-family:var(--num);font-weight:600;font-size:11px;letter-spacing:.3em}
.scrollcue i{display:block;width:1px;height:46px;background:linear-gradient(var(--ink),transparent);position:relative;overflow:hidden}
.scrollcue i::after{content:"";position:absolute;left:-2px;top:0;width:5px;height:5px;border-radius:50%;background:var(--accent);animation:cue 2.2s ease-in-out infinite}
@keyframes cue{0%{top:-6px}70%,100%{top:46px}}
.eyebrow{display:flex;gap:10px;align-items:center;font-size:12px;font-weight:500;color:var(--gray);font-variant-numeric:tabular-nums}
.eyebrow b{font-family:var(--num);font-weight:600;color:var(--accent);font-size:15px}
.eyebrow i{width:1px;height:12px;background:var(--line)}

/* 모바일 하단 내비게이션: ←  01 / 03  → (배경 없이, 벽 글자와 같은 진한 색 · 넘기기는 주로 스와이프) */
#mnav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:none;align-items:center;justify-content:space-between;
  padding:0 8px env(safe-area-inset-bottom,0px);height:calc(58px + env(safe-area-inset-bottom,0px));color:var(--ink)}
#mnav button{height:48px;padding:0 20px;display:flex;align-items:center;font-size:0}   /* 글자(PREV/NEXT)는 숨기고 화살표만 — 누르는 영역은 48px 유지, 이름은 aria-label */
#mnav button svg{width:28px;height:12px}
#mnav button:disabled{opacity:.25;cursor:default}
#mnav button:not(:disabled):active{opacity:.5}
#pCount{font:500 14px/1 var(--sans);letter-spacing:.06em;color:rgba(26,26,26,.6);text-align:center;min-width:6em}
#pCount b{color:inherit;font-weight:inherit}   /* 번호도 나머지와 같은 회색·굵기 */
@media (max-width:759px){#mnav{display:flex;align-items: center;}#hero{display:none}.menu-panel{width:100%;padding-top:calc(env(safe-area-inset-top,0px) + 4px)}.mlist{margin-top:0}}   /* 모바일 메뉴: 위쪽 여백 줄임 */
/* 모바일 위쪽 바: 배경 없이, 로고·아이콘은 진한 색(데스크톱과 같음) */
@media (min-width:760px){.top{padding:24px 26px 0 34px}}

#hint{position:fixed;z-index:12;left:50%;top:calc(env(safe-area-inset-top,0px) + 78px);transform:translateX(-50%);background:rgba(26,26,26,.82);color:var(--wall);
  font-size:13px;padding:8px 14px;width:max-content;max-width:calc(100vw - 32px);text-align:center;transition:opacity .6s;pointer-events:none;border-radius:3px}
#hint.off{opacity:0}

/* 메뉴 */
#menu,#sheet{position:fixed;inset:0;display:flex;justify-content:flex-end}
#menu{z-index:40}#sheet{z-index:45;align-items:flex-end}
.scrim{position:absolute;inset:0;background:rgba(26,26,26,.4);opacity:0;transition:opacity .35s}
#menu.open .scrim,#sheet.open .scrim{opacity:1}
.menu-panel{font-family:var(--sans);position:relative;width:min(380px,100%);height:100%;background:var(--menu);color:var(--wall);overflow-y:auto;overscroll-behavior:contain;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 34px calc(env(safe-area-inset-bottom,0px) + 34px);
  transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.7,.2,1)}
#menu.open .menu-panel{transform:none}
.menu-head{display:flex;justify-content:flex-end;margin-right:-14px}
.menu-panel .x{width:48px;height:48px}
.menu-panel .x svg{width:28px;height:28px}
.mlist{list-style:none;margin:28px 0 0;padding:0}
.mlist>li{border-bottom:1px solid rgba(253,253,253,.32)}
.mlist>li:last-child{border-bottom:0}
.mrow{display:flex;align-items:center;gap: 8px;}
.mgo{flex:1;text-align:left;display:flex;align-items:center;gap: 12px;padding: 12px 0;font-family:var(--sans);font-weight:700;font-size:18px;min-width:0}
.mgo .no{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums;width:24px;flex:none}
.mgo .sep{width:2px;height:16px;background:currentColor;flex:none}
.mtog{width:40px;height:44px;display:grid;place-items:center;margin-right:-10px;flex:none}
.mtog svg{width:16px;height:16px;transition:transform .3s}
.mtog[aria-expanded="false"] svg{transform:rotate(-90deg)}
.mtog.arrow svg{transform:rotate(-90deg)}
.msub{list-style:none;margin: -4px 0 0;padding: 0px 0 14px 50px;}
.msub[hidden]{display:none}
.msub button{display:block;text-align:left;font-size:14px;line-height:1.5;padding:4px 0;color:rgba(253,253,253,.72)}
.msub button:hover,.mgo:hover{color:var(--wall)}
.msub button:hover{text-decoration:underline;text-underline-offset:3px}
.mlist .on{color:var(--hi)!important;font-weight:700}
.mgo.on .sep{background:var(--hi)}
.credits{margin-top:30px;font-size:11.5px;color:rgba(253,253,253,.55);line-height:1.7}
.credits p{margin:0 0 4px}

/* 상세 시트 (시안의 펼친 캡션 카드) */
.sheet-panel{position:relative;width:100%;max-height:92%;background:var(--wall);overflow-y:auto;overscroll-behavior:contain;
  padding:0 0 calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.7,.2,1)}
#sheet.open .sheet-panel{transform:none}
@media (min-width:760px){
  #sheet{align-items:stretch}
  .sheet-panel{width:480px;max-height:none;height:100%;transform:translateX(100%)}
}
.sheet-bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 10px 20px;background:var(--card);color:var(--wall)}
.sheet-bar .x{width:40px;height:40px;display:grid;place-items:center;color:var(--wall);margin-right:-4px;cursor:pointer}.sheet-bar .x svg{width:22px;height:22px}.sheet-bar .x:hover{opacity:.75}
.sheet-bar .eyebrow{color:rgba(253,253,253,.8)}.sheet-bar .eyebrow b{color:var(--wall)}.sheet-bar .eyebrow i{background:rgba(253,253,253,.4)}
.sheet-body{padding:26px 20px 32px;display:flex;flex-direction:column;gap:22px}
.sheet-body figure{margin:0}
.fr{background:var(--ink);padding:10px;box-shadow:5px 5px 4px rgba(26,26,26,.3)}
.fr div{background:var(--wall);padding:5px}
.fr img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.sheet-body figcaption{font-size:12px;color:var(--gray);margin-top:10px}
.s-title h2{font-family:var(--serif);font-weight:700;-webkit-text-stroke:.4px currentColor;font-size:26px;line-height:1.3;margin:0;color:var(--accent);letter-spacing:-.015em;text-wrap:balance}
.s-title p{margin:4px 0 0;font-size:13px;color:var(--gray)}
.block .lab{font-family:var(--num);font-size:12px;font-weight:600;letter-spacing:.12em;margin:0 0 6px;color:var(--accent);display:flex;align-items:center;gap:8px}
.block .lab::before{content:"";width:16px;height:2px;background:currentColor}
.block p{margin:0;font-size:15.5px;line-height:1.85;max-width:60ch}
.nw{white-space:nowrap}
/* 웹: 이야기 창 왼쪽에 사진을 크게 (벽의 액자와 같은 검은 테·흰 여백). 모바일은 이야기 창만 */
.sheet-photo{display:none}
@media (min-width:760px){
  .sheet-photo{position:absolute;top:0;bottom:0;left:0;right:480px;margin:0;display:flex;align-items:center;justify-content:center;padding:56px 64px;pointer-events:none;
    opacity:0;transform:scale(.97);transition:opacity .45s,transform .45s cubic-bezier(.2,.7,.2,1)}
  #sheet.open .sheet-photo{opacity:1;transform:none}
  .sheet-photo .fr{padding:12px;display:flex;box-shadow:0 18px 40px rgba(26,26,26,.35)}   /* 벽의 액자와 같은 비율: 검은 테는 좁게 */
  .sheet-photo .fr div{padding:34px;display:flex}   /* 흰 여백은 넓게 */
  .sheet-photo img{width:auto;height:auto;aspect-ratio:auto;object-fit:contain;max-width:calc(100vw - 480px - 128px - 92px);max-height:calc(100vh - 112px - 92px)}
}
.info{display:grid;grid-template-columns:64px 1fr;gap:8px 12px;margin:0;font-size:13.5px;border-top:1px solid var(--line);padding-top:16px}
.info dt{color:var(--gray)}
.info dd{margin:0;min-width:0}
.info a{color:var(--accent);font-weight:500;text-underline-offset:3px}
.sheet-nav{display:flex;gap:8px}
.sheet-nav button{flex:1;border:1px solid var(--ink);padding:11px 8px;font-size:13.5px;font-weight:500}
.sheet-nav button:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--wall)}
.sheet-nav button:disabled{opacity:.35;cursor:default}

/* 로더 */
#loader{position:fixed;inset:0;z-index:60;background:var(--wall);   /* 엔딩과 같은 흰 바탕 + 돌 질감(아래 #endScreen::before와 함께 씀) */display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity 1.2s}
#loader.off{opacity:0;pointer-events:none}
#loader .ttl{font-family:var(--serif);font-weight:700;line-height:1.45;-webkit-text-stroke:.4px currentColor;font-size:clamp(20px,5vw,26px);color:var(--accent);text-align:center;padding:0 24px}
/* 로딩: 발자국(웹페이지/footprint.svg)이 0.5초마다 하나씩 찍히고, 찍힌 발자국은 서서히 사라짐 → 다음 바퀴에 같은 자리가 찍힐 땐 이미 비어 있음 */
#loader .steps{display:block;width:230px;height:auto;margin:14px 0 2px;overflow:visible}
#loader .steps .fp{fill:var(--accent);opacity:0;animation:step 4.4s linear infinite}
#loader .steps .fp:nth-child(2){animation-delay:.5s}#loader .steps .fp:nth-child(3){animation-delay:1s}#loader .steps .fp:nth-child(4){animation-delay:1.5s}
#loader .steps .fp:nth-child(5){animation-delay:2s}#loader .steps .fp:nth-child(6){animation-delay:2.5s}#loader .steps .fp:nth-child(7){animation-delay:3s}#loader .steps .fp:nth-child(8){animation-delay:3.5s}
@keyframes step{0%{opacity:0}1%{opacity:.9}13%{opacity:.9}43%,100%{opacity:0}}   /* 찍힘 → 약 0.55초 유지 → 약 1.3초에 걸쳐 사라짐 (발자국 8개, 한 바퀴 4.4초) */
@media (prefers-reduced-motion:reduce){#loader .steps .fp{opacity:.85}}   /* 움직임 줄이기: 발자국을 멈춘 채로 모두 보여줌 */
#loader .msg{font-size:13px;color:var(--gray);min-height:1.6em;text-align:center;padding:0 24px;margin-top:18px}
#loader .msg.err{color:var(--ink);font-size:14px;max-width:34em;line-height:1.7}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s !important;animation:none !important}}
/* 엔딩: 전시실을 나서며 바뀐 흰 화면 위에 바로 띄움 */
#endScreen{position:fixed;inset:0;z-index:10;background:var(--wall);   /* 흰 바탕 — 돌 질감은 아래 ::before에서 */
  display:flex;align-items:center;justify-content:center;padding:92px 24px 88px;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s}
/* 엔딩 돌 질감: 바닥 돌 사진을 밝게 날려 바탕은 흰색 그대로, 어두운 알갱이·얼룩만 남김 (contrast·opacity를 올리면 질감이 진해짐) */

function wrap(ctx,text,maxW){
  const out=[];
  text.split('\n').forEach(par=>{
    let line='';
    par.split(' ').forEach(word=>{
      const test=line?line+' '+word:word;
      if(ctx.measureText(test).width>maxW && line){out.push(line);line=word;} else line=test;
      while(ctx.measureText(line).width>maxW && line.length>1){
        let i=line.length; while(i>1 && ctx.measureText(line.slice(0,i)).width>maxW) i--;
        out.push(line.slice(0,i)); line=line.slice(i);
      }
    });
    out.push(line);
  });
  return out;
}

    // 복도 ↔ 전시실: ① 입구 앞까지 일직선 → ② 입구를 지나 안쪽으로 일직선 → ③ 작품 앞으로
    /* 들어갈 때: 지금 높이·거리 그대로 입구 앞까지 옆으로 이동 → 정면(수평 시선)으로 곧장 안으로 (아래로 내려다보지 않음)

    const outside=inRoom(from.pos)?to.pos:from.pos,inRm=inRoom(from.pos)?from.pos:to.pos;

      ?{out:true,pts:[from.pos,from.pos,inside,front,to.pos],qs:[from.q,from.q,qOut,qOut,to.q],at:[0,.1,.22,.62,1]}
      :{pts:[from.pos,front,inside,to.pos,to.pos],qs:[from.q,qIn,qIn,to.q,to.q],at:[0,.3,.74,.86,1]};
